limit_req_zone $binary_remote_addr zone=storage_reads:1m rate=60r/m;
map $request_method $storage_write_ip { default ""; PUT $binary_remote_addr; }
limit_req_zone $storage_write_ip zone=storage_writes:1m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=storage_connections:1m;
server {
 listen 80;
 server_tokens off;
 set_real_ip_from 172.28.243.1;
 real_ip_header CF-Connecting-IP;
 limit_req_status 429;
 limit_conn_status 429;
 limit_conn storage_connections 20;
 client_max_body_size 256m;
 client_header_timeout 10s;
 client_body_timeout 30s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
 location = /health { proxy_pass http://storage:8090; }
 location / {
  limit_req zone=storage_reads burst=30 nodelay;
  limit_req zone=storage_writes burst=5 nodelay;
  proxy_pass http://storage:8090;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
 }
}
