name: forge-storage
services:
 storage:
  image: forge-storage:local
  environment:
   STORAGE_TOKEN: ${STORAGE_TOKEN:?set STORAGE_TOKEN}
   STORAGE_ROOT: /data
   PORT: 8090
  volumes: ["objects:/data"]
  restart: unless-stopped
 proxy:
  image: nginx:1.27-alpine
  ports: ["127.0.0.1:${STORAGE_PORT:-18104}:80"]
  volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  depends_on:
   storage: {condition: service_healthy}
  restart: unless-stopped
volumes:
 objects:
networks:
 default:
  ipam:
   config: [{subnet: 172.28.243.0/28}]
